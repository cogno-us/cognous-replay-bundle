# Cross-component suite delegated to its canonical testing repository.
name: Synthetic recovery inspection
'on':
  pull_request:
    paths:
    - src/agent_replay_bundle/recovery_inspection.py
    - tests/recovery_inspection_checks.py
    - docs/recovery-inspection.md
    - .github/workflows/recovery-inspection.yml
  push:
    branches:
    - main
    paths:
    - src/agent_replay_bundle/recovery_inspection.py
    - tests/recovery_inspection_checks.py
    - docs/recovery-inspection.md
    - .github/workflows/recovery-inspection.yml
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-replay-bundle--recovery-inspection.yml@39f038435afdd71ba162860faa5718d90d7bde64
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 39f038435afdd71ba162860faa5718d90d7bde64
    permissions:
      contents: read
