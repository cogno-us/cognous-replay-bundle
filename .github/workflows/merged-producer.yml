# Cross-component suite delegated to its canonical testing repository.
name: Merged producer compatibility Linux
'on':
  push:
    paths:
    - src/agent_replay_bundle/importers.py
    - scripts/generate_producer_v2_examples.py
    - qualification/test_merged_producer.py
    - .github/workflows/merged-producer.yml
  pull_request:
    paths:
    - src/agent_replay_bundle/importers.py
    - scripts/generate_producer_v2_examples.py
    - qualification/test_merged_producer.py
    - .github/workflows/merged-producer.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-replay-bundle--merged-producer.yml@5c61cd89f95751ad56d1b4e46d1b2ee7cf095543
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 5c61cd89f95751ad56d1b4e46d1b2ee7cf095543
    permissions:
      contents: read
